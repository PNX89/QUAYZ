name: CI

# Nothing here reaches a cloud account and nothing here needs a credential.
#
# The jobs arrive as the legs do. `checks` runs the offline suite, which is everything a stranger
# gets by cloning the repository and running pytest with nothing else installed. The cluster,
# envtest and container suites are deselected by default and get their own jobs, so the boundary
# of the test rig stays legible rather than being blurred into one green tick.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types and the offline suite
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      sync-args: "--dev"
      run-mypy: true

  # The controller, which is its own Go module. Separate from the Python job because it is a
  # separate language with a separate toolchain, and folding them together would mean a Go
  # compile error reported as a Python failure.
  controller:
    name: the controller, in Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: controller/go.sum
      - name: gofmt leaves nothing to say
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - name: the unit suite, against the fake clientset
        run: go test -race ./...
      - name: fetch a real control plane, once
        run: go run sigs.k8s.io/controller-runtime/tools/setup-envtest@latest use
      - name: resourceVersion resumption, against a real kube-apiserver
        # Behind a build tag because it needs 167 MB of kube-apiserver and etcd that a stranger
        # cloning this repository has not got. `go test ./...` stays useful for them.
        run: |
          KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@latest use -p path) \
            go test -tags envtest -v ./resume/...

  # The supply chain. Built twice and compared, then signed.
  #
  # THIS JOB IS WHERE THE REPRODUCIBILITY CLAIM LIVES BECAUSE IT IS THE ONLY PLACE IT CAN. buildx
  # is not installed on the machine this repository was written on, so the build that proves the
  # claim cannot run there. Committing a transcript nobody could regenerate would be worse than
  # enforcing the check here on every run, which is what this does: build twice, compare, fail.
  #
  # WHAT IS CLAIMED, PRECISELY. The IMAGE MANIFEST digest is reproducible. The attestation-bearing
  # INDEX digest is NOT, by design: provenance carries wall-clock times and a random invocationId,
  # and the SBOM generator stamps a random document UUID and its own creation time. Neither is
  # normalised by SOURCE_DATE_EPOCH. Measured across six independent no-cache builds during the
  # pre-flight, the manifest digest was identical every time and the index digest never was.
  #
  # AND SOURCE_DATE_EPOCH ALONE IS NOT ENOUGH. It normalises the image config and the history and
  # does not rewrite file mtimes inside the layer tars, so two builds a second apart differ in
  # four bytes of tar octal mtime. The exporter option rewrite-timestamp=true is what works, and
  # it requires SOURCE_DATE_EPOCH to be set. Setting only the first gives a green result whenever
  # two builds land in the same second, which is intermittent and flattering.
  supplychain:
    name: built twice, compared, then signed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing needs an OIDC token. Free for a public repository.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: a fixed timestamp, from the commit rather than from the clock
        id: epoch
        run: echo "value=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: build it once
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: |
          docker buildx build controller \
            --no-cache --provenance=false --sbom=false \
            --output type=oci,dest=/tmp/first.tar,rewrite-timestamp=true \
            --metadata-file /tmp/first.json

      - name: build it again, from nothing
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: |
          docker buildx build controller \
            --no-cache --provenance=false --sbom=false \
            --output type=oci,dest=/tmp/second.tar,rewrite-timestamp=true \
            --metadata-file /tmp/second.json

      - name: the two manifest digests must be the same
        run: |
          first=$(jq -r '."containerimage.digest"' /tmp/first.json)
          second=$(jq -r '."containerimage.digest"' /tmp/second.json)
          echo "first  $first"
          echo "second $second"
          if [ -z "$first" ] || [ "$first" = "null" ]; then
            echo "no digest in the metadata, so this compared nothing" >&2
            exit 1
          fi
          if [ "$first" != "$second" ]; then
            echo "the manifest digest is not reproducible" >&2
            exit 1
          fi

      - name: and the bytes on disk differ, which is why the digest is the claim
        # Two OCI tarballs can differ byte for byte while describing the identical image: tar
        # member order and the layout metadata are not part of what a digest covers. Asserting
        # the tarballs match would be asserting something stronger than reproducibility and it
        # would fail for reasons nobody cares about.
        run: |
          if cmp -s /tmp/first.tar /tmp/second.tar; then
            echo "note: the tarballs happen to match byte for byte as well"
          else
            echo "note: the tarballs differ, and the manifest digest above is what is claimed"
          fi

      - name: log in to the registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build with an SBOM and provenance, and push
        if: github.ref == 'refs/heads/main'
        id: push
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        run: |
          docker buildx build controller \
            --provenance=mode=max --sbom=true \
            --tag ghcr.io/pnx89/quayz-watch:${{ github.sha }} \
            --tag ghcr.io/pnx89/quayz-watch:latest \
            --push --metadata-file /tmp/pushed.json
          echo "digest=$(jq -r '."containerimage.digest"' /tmp/pushed.json)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main'

      - name: sign it, keyless
        if: github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes \
            ghcr.io/pnx89/quayz-watch@${{ steps.push.outputs.digest }}

      - name: verify the signature this job just made
        # Signing and not verifying proves the command exited zero. This proves the signature is
        # findable and belongs to this workflow, which is the thing a consumer would check.
        if: github.ref == 'refs/heads/main'
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/PNX89/QUAYZ/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ghcr.io/pnx89/quayz-watch@${{ steps.push.outputs.digest }}

  # The toolbox: four binaries at the versions this repository's evidence was made with.
  #
  # BUILT WITH BUILDX AND NOT PLAIN docker build, because the architecture has to be asserted and
  # only buildx honours the declaration. Built with the legacy builder on an arm64 host, the
  # image reports linux/arm64 while every binary inside it is x86-64, and it runs only where
  # emulation happens to be available. That is an image lying about itself, and the assertion
  # below is what stops it shipping.
  #
  # NOT PUSHED. Terraform's CLI is BUSL 1.1 under IBM, and its Additional Use Grant excludes
  # offering the work to third parties on a hosted or embedded basis. Building an image for
  # whoever clones this is squarely inside that; publishing one to a registry is a redistribution
  # question nobody needs this repository to answer.
  toolbox:
    name: four binaries, checksummed, and an image that admits its architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: build it, which is the only way to know the checksums are right
        run: |
          docker buildx build toolbox \
            --platform linux/amd64 \
            --load --tag quayz-toolbox:ci

      - name: the image must admit what it actually contains
        run: |
          arch=$(docker image inspect quayz-toolbox:ci --format '{{.Architecture}}')
          echo "image architecture: $arch"
          if [ "$arch" != "amd64" ]; then
            echo "the image reports $arch and its binaries are amd64" >&2
            exit 1
          fi

      - name: every tool is the version the evidence was produced with
        run: |
          set -e
          docker run --rm quayz-toolbox:ci kind version | grep -q 'v0.33.0'
          docker run --rm quayz-toolbox:ci helm version --short | grep -q 'v3.21.4'
          docker run --rm quayz-toolbox:ci terraform version | head -1 | grep -q 'v1.16.0'
          docker run --rm quayz-toolbox:ci kubectl version --client=true -o yaml | grep -q 'v1.37.0'

      - name: and it does the half that needs no cluster
        # The half that CAN be proved without handing a build agent the Docker socket. Creating
        # a cluster from inside the toolbox needs the host daemon, which is a real thing to hand
        # a container rather than a detail, so it is not done here and the README says so.
        run: |
          docker run --rm -v "$PWD:/work" -w /work quayz-toolbox:ci \
            helm lint charts/deploy-canary
          docker run --rm -v "$PWD:/work" -w /work quayz-toolbox:ci \
            helm template canary charts/deploy-canary
          docker run --rm -v "$PWD:/work" -w /work quayz-toolbox:ci \
            terraform -chdir=terraform/cluster fmt -check -recursive

      - name: and the chart refuses the values that used to render
        # FIVE MEASURED HOLES, ALL OF WHICH `helm lint` REPORTED AS "0 chart(s) failed". Asserted
        # as REFUSALS, because a gate that only proves the good path renders is the gate that let
        # every one of them through. The schema is Helm's to enforce, so this is the only place
        # it can be proved: tests/test_chart_values.py checks the schema and the chart cannot
        # drift apart, and this checks that helm actually acts on it.
        run: |
          set -eu
          helm_in_the_box() {
            docker run --rm -v "$PWD:/work" -w /work quayz-toolbox:ci \
              helm template canary charts/deploy-canary "$@"
          }
          refuses() {
            if helm_in_the_box "$@" >/dev/null 2>&1; then
              echo "the chart accepted $* and it should not have" >&2
              exit 1
            fi
            echo "refused: $*"
          }
          # "false" is a non-empty string, and a non-empty string is truthy in a Go template.
          refuses --set-string failure.crashLoop=false
          # The wrong case asked for nothing and installed a healthy pod, with no warning.
          refuses --set failure.crashloop=true
          # `y` is a YAML 1.1 boolean and the API server's decoder rejects the whole object.
          refuses --set image.pullPolicy=y
          # An unconstrained string rendered busybox@notadigest.
          refuses --set image.digest=notadigest
          # The crash loop exits before the allocation starts, so the OOMKill never happens.
          refuses --set failure.crashLoop=true --set failure.outOfMemory=true
          for switch in neverReady crashLoop outOfMemory; do
            helm_in_the_box --set "failure.$switch=true" >/dev/null
            echo "renders: failure.$switch=true"
          done

      - name: it runs as somebody other than root
        run: |
          who=$(docker run --rm quayz-toolbox:ci id -un)
          echo "runs as: $who"
          if [ "$who" = "root" ]; then
            echo "the toolbox runs as root, and it is meant to be handed a Docker socket" >&2
            exit 1
          fi

  # A real Kubernetes cluster, created and destroyed by the job. Every failure in
  # src/quayz/failures.py is produced against it and read off it.
  #
  # EVERY VERSION HERE IS PINNED AND THE ACTION'S OWN DEFAULTS ARE ALL WRONG FOR THIS. It
  # defaults to kind v0.31.0, kubectl v1.35.0, a cluster named chart-testing and a 60 second
  # wait. A cold create on the machine this was developed on took 98 seconds, so the wait is
  # generous rather than default, and kind's own release notes insist the node image is pinned
  # by digest because a tag alone does not guarantee an image built for that release.
  cluster:
    name: every failure, on a cluster made and destroyed here
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          # The wrapper reformats stdout and this job reads exit codes off terraform.
          terraform_wrapper: false
      - uses: helm/kind-action@v1.14.0
        with:
          version: v0.33.0
          kubectl_version: v1.37.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          cluster_name: quayz-ci
          wait: 180s
          install_only: true
      - run: uv sync --dev
      - name: produce every failure and record what each instrument said
        run: scripts/measure_failures.sh quayz-ci
      - name: fail if any measured outcome has changed
        run: git diff --exit-code -- docs/evidence/cluster/summary.json
      - name: break a deploy twice and recover it two ways
        run: scripts/measure_rollback.sh quayz-ci-rollback
      - name: fail if any recovery outcome has changed
        run: git diff --exit-code -- docs/evidence/rollback/summary.json
      - name: edit a cluster by hand and ask two instruments about it
        run: scripts/measure_drift.sh quayz-ci-drift
      - name: fail if either detector has changed its answer
        run: git diff --exit-code -- docs/evidence/drift/summary.json
      - name: the offline half, against what was just recorded
        run: >-
          uv run pytest tests/test_cluster_failures.py tests/test_rollback.py tests/test_drift.py
