[project]
name = "quayz"
version = "0.1.0"
description = "What a cluster does when the deploy is wrong, proved on a cluster that is created and destroyed by the test run"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
    "types-PyYAML>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quayz"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ONE marker, DESELECTED by default rather than skipped, because a skipped test reports as a
# pass and nobody reads it. It needs kind, kubectl and helm, which a stranger cloning this will
# not have, and the CI job that does have them selects it explicitly.
#
# There were three. `envtest` and `container` had NO TESTS AT ALL: the envtest suite is Go and
# runs under `go test -tags envtest`, and the container work is a build that happens in CI. Two
# marker names describing a rig that does not exist read as coverage, which is why they are
# gone rather than left as documentation of an intention.
addopts = "-q -m 'not cluster'"
markers = [
    "cluster: needs kind, kubectl and helm. Creates a cluster and destroys it. Run with -m cluster.",
]
filterwarnings = ["error"]

[tool.mypy]
# scripts joins this list as soon as it holds Python. Naming a directory mypy cannot find is
# an error rather than a no-op, so it is added with its first file rather than in advance.
# scripts is here too, and it was not. The two scripts CI and the README depend on were the
# only Python in the repository nothing type checked, and the tests that import them could not
# resolve the module either. `mypy_path` is what makes `from readme_block import block` mean the
# same thing to mypy that it means to pytest.
files = ["src", "tests", "scripts", "examples"]
mypy_path = ["scripts"]
strict = true
