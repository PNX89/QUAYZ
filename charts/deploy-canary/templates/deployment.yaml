{{- /*
The workload. Its command is written out in full rather than baked into an image, because the
whole subject of this chart is what a failing deploy looks like and an explanation you have to
go and read somewhere else is not one.

THE COMMAND, IN ORDER:
  1. If crashLoop is asked for, exit 1 after two seconds. That is reason=Error, exit code 1.
  2. If outOfMemory is asked for, `tail /dev/zero`, which reads an endless stream into memory
     until the cgroup limit is reached. That is reason=OOMKilled, exit code 137. Lines 1 and 2
     produce the SAME CrashLoopBackOff and the same climbing restart count.
  3. Otherwise serve HTTP, and touch the readiness file unless neverReady is asked for.

THE TWO PROBES USE DIFFERENT MECHANISMS ON PURPOSE. Liveness is an HTTP GET against the server:
it answers "is this process wedged", and its answer RESTARTS the container. Readiness is an exec
that looks for a file: it answers "should traffic go here", and its answer only adds or removes
an endpoint. Pointing both at the same check is the common mistake, and it turns a slow
dependency into a restart loop of a process that was working.

ASKING FOR TWO FAILURES AT ONCE IS REFUSED RATHER THAN SILENTLY HALVED. With both crashLoop and
outOfMemory set, both blocks used to render and the second was dead code: the shell exits 1 two
seconds in and never reaches `tail /dev/zero`. The run produced reason=Error, the caller had
asked for an OOMKill, and nothing said so. A refusal at render time is the only place that is
catchable without a cluster.

The guard counts rather than naming a pair, because every combination has the same shape: a
container whose image never pulled cannot crash loop, and a crash loop exits before it can fail
to become ready. Whichever switch wins, the caller measures a failure they did not ask for.
*/ -}}
{{- $asked := list -}}
{{- range $name, $on := .Values.failure -}}
{{- if $on -}}{{- $asked = append $asked $name -}}{{- end -}}
{{- end -}}
{{- if gt (len $asked) 1 -}}
{{- fail (printf "%v were all asked for, and this chart produces one failure at a time. They are not independent: a container whose image never pulled cannot crash loop, and a crash loop exits before an allocation starts or a readiness file is written. Whichever one wins, the run measures a failure nobody asked for." $asked) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deploy-canary.name" . }}
  labels:
    {{- include "deploy-canary.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "deploy-canary.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deploy-canary.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 2
      containers:
        - name: canary
          image: {{ include "deploy-canary.image" . }}
          # Quoted. Unquoted, `--set image.pullPolicy=y` renders a bare y, which is a YAML 1.1
          # boolean, and the API server's deserializer rejects the object with "cannot unmarshal
          # bool into Go struct field Container...imagePullPolicy". helm lint and helm template
          # both called it fine; the schema's enum is what catches it now, and the quotes are
          # what stop the next value nobody thought of from becoming a boolean.
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              {{- if .Values.failure.crashLoop }}
              # Asked for: exit non-zero shortly after starting.
              sleep 2
              echo "exiting on purpose" >&2
              exit 1
              {{- end }}
              {{- if .Values.failure.outOfMemory }}
              # Asked for: read an endless stream into memory until the cgroup limit is hit.
              # The logs of this container end mid-sentence with nothing wrong in them, which is
              # the entire reason a log-based detector cannot see an OOMKill.
              echo "allocating"
              tail /dev/zero
              {{- end }}
              mkdir -p /www
              echo "canary {{ .Chart.AppVersion }}" > /www/index.html
              {{- if not .Values.failure.neverReady }}
              # Ready after a moment. With neverReady set, this file is never created, the
              # readiness exec never passes, and the pod stays out of the Service while
              # `kubectl get pods` reports Running with a restart count of zero.
              ( sleep 3 && touch /tmp/ready ) &
              {{- end }}
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/ready"]
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
