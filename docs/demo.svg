<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 621" width="842" height="621" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="13">
<style>
text{fill:#d6d5ce;white-space:pre;dominant-baseline:middle}
text.cmd{fill:#d9a441;font-weight:600}
@keyframes l0{0%,0.000%{opacity:0}0.000%,100%{opacity:1}}@keyframes l1{0%,0.930%{opacity:0}0.940%,100%{opacity:1}}@keyframes l2{0%,1.870%{opacity:0}1.880%,100%{opacity:1}}@keyframes l3{0%,2.811%{opacity:0}2.821%,100%{opacity:1}}@keyframes l4{0%,3.751%{opacity:0}3.761%,100%{opacity:1}}@keyframes l5{0%,4.691%{opacity:0}4.701%,100%{opacity:1}}@keyframes l6{0%,5.631%{opacity:0}5.641%,100%{opacity:1}}@keyframes l7{0%,6.571%{opacity:0}6.581%,100%{opacity:1}}@keyframes l8{0%,7.511%{opacity:0}7.521%,100%{opacity:1}}@keyframes l9{0%,8.452%{opacity:0}8.462%,100%{opacity:1}}@keyframes l10{0%,9.392%{opacity:0}9.402%,100%{opacity:1}}@keyframes l11{0%,10.332%{opacity:0}10.342%,100%{opacity:1}}@keyframes l12{0%,11.272%{opacity:0}11.282%,100%{opacity:1}}@keyframes l13{0%,12.212%{opacity:0}12.222%,100%{opacity:1}}@keyframes l14{0%,13.152%{opacity:0}13.162%,100%{opacity:1}}@keyframes l15{0%,14.093%{opacity:0}14.103%,100%{opacity:1}}@keyframes l16{0%,15.033%{opacity:0}15.043%,100%{opacity:1}}@keyframes l17{0%,15.973%{opacity:0}15.983%,100%{opacity:1}}@keyframes l18{0%,16.913%{opacity:0}16.923%,100%{opacity:1}}@keyframes l19{0%,17.853%{opacity:0}17.863%,100%{opacity:1}}@keyframes l20{0%,18.793%{opacity:0}18.803%,100%{opacity:1}}@keyframes l21{0%,19.734%{opacity:0}19.744%,100%{opacity:1}}@keyframes l22{0%,20.674%{opacity:0}20.684%,100%{opacity:1}}@keyframes l23{0%,21.614%{opacity:0}21.624%,100%{opacity:1}}@keyframes l24{0%,22.554%{opacity:0}22.564%,100%{opacity:1}}@keyframes l25{0%,23.494%{opacity:0}23.504%,100%{opacity:1}}@keyframes l26{0%,24.434%{opacity:0}24.444%,100%{opacity:1}}@keyframes l27{0%,25.375%{opacity:0}25.385%,100%{opacity:1}}@keyframes l28{0%,26.315%{opacity:0}26.325%,100%{opacity:1}}@keyframes l29{0%,27.255%{opacity:0}27.265%,100%{opacity:1}}
</style>
<rect width="842" height="621" rx="8" fill="#14141a"/>
<circle cx="20" cy="15" r="5" fill="#e05a51"/><circle cx="38" cy="15" r="5" fill="#e0b341"/><circle cx="56" cy="15" r="5" fill="#57b95a"/>
<text x="18" y="34" class="cmd" style="animation:l0 5850ms steps(1,end) infinite">$ uv run python examples/tell_them_apart.py</text><text x="18" y="53" style="animation:l1 5850ms steps(1,end) infinite"></text><text x="18" y="72" style="animation:l2 5850ms steps(1,end) infinite">Six instruments, five states, one cluster. Measured, not asserted.</text><text x="18" y="91" style="animation:l3 5850ms steps(1,end) infinite"></text><text x="18" y="110" style="animation:l4 5850ms steps(1,end) infinite">                          phase  restarts           waiting  terminated  exit  ready</text><text x="18" y="129" style="animation:l5 5850ms steps(1,end) infinite">------------------------------------------------------------------------------------</text><text x="18" y="148" style="animation:l6 5850ms steps(1,end) infinite">healthy                 Running        no              none        none  none      2</text><text x="18" y="167" style="animation:l7 5850ms steps(1,end) infinite">image cannot be pulled  Pending        no  ImagePullBackOff        none  none      0</text><text x="18" y="186" style="animation:l8 5850ms steps(1,end) infinite">crash loop              Running       yes  CrashLoopBackOff       Error     1      0</text><text x="18" y="205" style="animation:l9 5850ms steps(1,end) infinite">killed for memory       Running       yes  CrashLoopBackOff   OOMKilled   137      0</text><text x="18" y="224" style="animation:l10 5850ms steps(1,end) infinite">alive but never ready   Running        no              none        none  none      0</text><text x="18" y="243" style="animation:l11 5850ms steps(1,end) infinite"></text><text x="18" y="262" style="animation:l12 5850ms steps(1,end) infinite">A crash loop and an OOMKill agree on 4 of these 6 columns (phase, restarts, waiting, ready).</text><text x="18" y="281" style="animation:l13 5850ms steps(1,end) infinite">They differ on 2: terminated, exit.</text><text x="18" y="300" style="animation:l14 5850ms steps(1,end) infinite">  crash loop        Error with exit 1</text><text x="18" y="319" style="animation:l15 5850ms steps(1,end) infinite">  killed for memory OOMKilled with exit 137</text><text x="18" y="338" style="animation:l16 5850ms steps(1,end) infinite">And they present identically: &apos;killed for memory&apos; shares its symptom.</text><text x="18" y="357" style="animation:l17 5850ms steps(1,end) infinite"></text><text x="18" y="376" style="animation:l18 5850ms steps(1,end) infinite">What each instrument can do with that:</text><text x="18" y="395" style="animation:l19 5850ms steps(1,end) infinite">  restart count                                separates nothing</text><text x="18" y="414" style="animation:l20 5850ms steps(1,end) infinite">  container logs                               separates crash loop</text><text x="18" y="433" style="animation:l21 5850ms steps(1,end) infinite">  pod phase                                    separates image cannot be pulled</text><text x="18" y="452" style="animation:l22 5850ms steps(1,end) infinite">  lastState.terminated.reason with exitCode    separates crash loop, killed for memory</text><text x="18" y="471" style="animation:l23 5850ms steps(1,end) infinite">  state.waiting.reason                         separates image cannot be pulled</text><text x="18" y="490" style="animation:l24 5850ms steps(1,end) infinite">  EndpointSlice readiness                      separates nothing</text><text x="18" y="509" style="animation:l25 5850ms steps(1,end) infinite">  every instrument at once, read together      separates image cannot be pulled, crash loop, ...</text><text x="18" y="528" style="animation:l26 5850ms steps(1,end) infinite">  terraform plan over a helm_release           separates nothing</text><text x="18" y="547" style="animation:l27 5850ms steps(1,end) infinite">  the declared objects against the live ones   separates changed by hand afterwards</text><text x="18" y="566" style="animation:l28 5850ms steps(1,end) infinite"></text><text x="18" y="585" style="animation:l29 5850ms steps(1,end) infinite">... 3 more lines, in full on the card</text>
</svg>
